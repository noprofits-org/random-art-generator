<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#100e0b" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Salon · Met Art</title>
<link rel="manifest" href="./manifest.json" />
<link rel="icon" href="./icons/icon-192x192.png" />
<link rel="apple-touch-icon" href="./icons/icon-192x192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#100e0b; --bg2:#1b1713; --surface:rgba(245,238,224,.055);
  --line:rgba(245,238,224,.10); --line-2:rgba(245,238,224,.16);
  --cream:#f4eee1; --cream-2:rgba(244,238,225,.62); --cream-3:rgba(244,238,225,.34);
  --gold:#d8af5f; --gold-2:#e7c577; --gold-soft:rgba(216,175,95,.15);
  --serif:'Cormorant Garamond',Georgia,serif;
  --sans:'Hanken Grotesk',-apple-system,system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;}
body{
  background:#080706;
  background-image:radial-gradient(120% 90% at 50% 0%, #1a1612 0%, #0a0807 55%, #060504 100%);
  font-family:var(--sans);color:var(--cream);
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
#root{display:flex;align-items:center;justify-content:center;}
button{font-family:inherit;color:inherit;border:none;background:none;cursor:pointer;}
img{display:block;}

/* ── App shell ── */
.app-root{height:100%;position:relative;overflow:hidden;background:var(--bg);}
.screen-host{position:absolute;inset:0;}
.screen{height:100%;display:flex;flex-direction:column;padding:54px 0 0;color:var(--cream);}

.screen-head{display:flex;align-items:flex-end;justify-content:space-between;padding:10px 22px 14px;flex-shrink:0;}
.brand-eyebrow{font-size:11px;letter-spacing:.22em;color:var(--gold);font-weight:600;margin-bottom:5px;}
.brand-title{font-family:var(--serif);font-weight:500;font-size:42px;line-height:1;margin:0;letter-spacing:.4px;}
.ghost-btn{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:var(--surface);border:1px solid var(--line);color:var(--cream-2);}
.ghost-btn:active{transform:scale(.94);}

.eyebrow{font-size:10.5px;letter-spacing:.2em;color:var(--gold);font-weight:600;text-transform:uppercase;margin-bottom:7px;}

/* ── Discover card stack ── */
.stack-wrap{position:relative;flex:1;margin:6px 22px 0;touch-action:none;}
.art-card{position:absolute;inset:0;border-radius:30px;overflow:hidden;background:#000;
  box-shadow:0 30px 60px rgba(0,0,0,.55),0 2px 0 rgba(255,255,255,.05) inset;
  user-select:none;border:1px solid rgba(255,255,255,.06);}
.art-card-img{position:absolute;inset:0;background-size:cover;background-position:center;}
.art-card-shade{position:absolute;inset:0;background:linear-gradient(to top,
  rgba(8,7,6,.92) 0%, rgba(8,7,6,.62) 26%, rgba(8,7,6,0) 52%);}
.art-card-meta{position:absolute;left:0;right:0;bottom:0;padding:26px 26px 30px;}
.art-title{font-family:var(--serif);font-weight:500;font-size:32px;line-height:1.08;letter-spacing:.3px;
  text-shadow:0 2px 18px rgba(0,0,0,.6);margin-top:3px;text-wrap:pretty;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
.art-sub{font-size:14.5px;color:var(--cream-2);margin-top:9px;font-weight:500;}
.art-sub .dot{margin:0 7px;opacity:.5;}
.pd-pill{position:absolute;top:18px;left:18px;background:rgba(8,7,6,.5);backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.18);border-radius:100px;padding:6px 12px;}
.pd-pill span{font-size:9.5px;letter-spacing:.16em;font-weight:600;color:var(--cream);white-space:nowrap;}
.verdict{position:absolute;top:30px;font-family:var(--serif);font-weight:600;font-size:30px;
  letter-spacing:.12em;padding:7px 18px;border-radius:12px;opacity:0;pointer-events:none;}
.verdict-save{right:24px;color:var(--gold-2);border:2.5px solid var(--gold-2);transform:rotate(12deg);text-shadow:0 2px 10px rgba(0,0,0,.5);}
.verdict-skip{left:24px;color:#e8d9c4;border:2.5px solid #e8d9c4;transform:rotate(-12deg);}

.skeleton{display:flex;align-items:center;justify-content:center;background:var(--bg2);}
.sk-shimmer{position:absolute;inset:0;background:linear-gradient(110deg,#1b1713 8%,#262019 18%,#1b1713 33%);
  background-size:220% 100%;animation:sh 1.5s linear infinite;}
@keyframes sh{to{background-position:-220% 0;}}
.sk-cap{position:relative;font-family:var(--serif);font-size:21px;color:var(--cream-2);font-style:italic;z-index:2;padding:0 30px;text-align:center;}

.action-row{display:flex;align-items:center;justify-content:center;gap:22px;padding:22px 0 8px;flex-shrink:0;}
.round-btn{width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:var(--surface);border:1px solid var(--line-2);color:var(--cream);transition:transform .15s,background .2s;}
.round-btn:active{transform:scale(.9);}
.round-btn.open{width:50px;height:50px;color:var(--cream-2);}
.round-btn.skip{color:#e8d9c4;}
.round-btn.save{color:var(--gold-2);border-color:rgba(216,175,95,.5);background:var(--gold-soft);}
.swipe-hint{text-align:center;font-size:11.5px;color:var(--cream-3);letter-spacing:.04em;padding:0 0 100px;flex-shrink:0;}

/* ── Search ── */
.search-bar{display:flex;align-items:center;gap:10px;margin:0 22px 14px;padding:0 14px;height:48px;
  background:var(--surface);border:1px solid var(--line);border-radius:15px;color:var(--cream-3);flex-shrink:0;}
.search-bar input{flex:1;background:none;border:none;outline:none;color:var(--cream);font-size:16px;font-family:inherit;}
.search-bar input::placeholder{color:var(--cream-3);}
.clear-x{width:24px;height:24px;display:flex;align-items:center;justify-content:center;color:var(--cream-3);}
.chip-scroll{display:flex;gap:8px;overflow-x:auto;padding:0 22px 14px;flex-shrink:0;scrollbar-width:none;}
.chip-scroll::-webkit-scrollbar{display:none;}
.filter-chip{white-space:nowrap;padding:8px 15px;border-radius:100px;font-size:13px;font-weight:500;
  background:var(--surface);border:1px solid var(--line);color:var(--cream-2);}
.filter-chip.on{background:var(--cream);color:#1a140c;border-color:var(--cream);font-weight:600;}
.grid-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.grid-scroll::-webkit-scrollbar{display:none;}

.masonry{column-count:2;column-gap:11px;padding:2px 16px 110px;}
.m-tile{position:relative;display:block;width:100%;margin:0 0 11px;break-inside:avoid;border-radius:14px;
  overflow:hidden;background:var(--bg2);text-align:left;border:1px solid var(--line);}
.m-tile img{width:100%;height:auto;display:block;}
.m-tile.sk-shimmer{position:relative;}
.m-cap{position:absolute;left:0;right:0;bottom:0;padding:22px 12px 11px;
  background:linear-gradient(to top,rgba(8,7,6,.9),rgba(8,7,6,0));}
.m-title{font-family:var(--serif);font-size:16px;line-height:1.12;font-weight:500;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.m-artist{font-size:11px;color:var(--cream-2);margin-top:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  color:var(--cream-3);padding:60px 40px;gap:14px;}
.empty-state p{font-size:14px;line-height:1.5;margin:0;max-width:260px;}
.empty-state.tall{padding-top:90px;}
.empty-art{width:90px;height:90px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:var(--gold-soft);color:var(--gold);border:1px solid rgba(216,175,95,.3);}
.empty-state h3{font-family:var(--serif);font-size:26px;font-weight:500;margin:6px 0 0;color:var(--cream);}
.count-pill{min-width:34px;height:34px;padding:0 11px;border-radius:100px;background:var(--gold-soft);
  border:1px solid rgba(216,175,95,.35);color:var(--gold-2);font-weight:600;font-size:15px;
  display:flex;align-items:center;justify-content:center;}

/* ── Daily ── */
.daily-wrap{flex:1;margin:6px 22px 0;position:relative;min-height:0;}
.daily-card{position:absolute;inset:0;border-radius:28px;overflow:hidden;background:#000;
  box-shadow:0 30px 60px rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.06);}
.daily-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .5s;}
.daily-shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(8,7,6,.94) 2%,rgba(8,7,6,.5) 30%,rgba(8,7,6,0) 58%);}
.daily-badge{position:absolute;top:20px;left:20px;font-size:10px;letter-spacing:.2em;font-weight:600;
  color:#1a140c;background:var(--gold);padding:6px 12px;border-radius:100px;}
.daily-meta{position:absolute;left:0;right:0;bottom:0;padding:26px 26px 30px;}
.daily-title{font-family:var(--serif);font-weight:500;font-size:34px;line-height:1.06;margin-top:4px;
  text-shadow:0 2px 18px rgba(0,0,0,.55);text-wrap:pretty;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
.streak-badge{display:flex;align-items:center;gap:6px;padding:8px 13px;border-radius:100px;
  background:var(--gold-soft);border:1px solid rgba(216,175,95,.35);color:var(--gold-2);font-weight:600;font-size:13px;}
.daily-actions{display:flex;gap:12px;padding:18px 22px 100px;flex-shrink:0;}
.pill-btn{height:54px;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:9px;
  font-size:15.5px;font-weight:600;background:var(--surface);border:1px solid var(--line-2);color:var(--cream);flex:1;}
.pill-btn.primary{background:var(--cream);color:#1a140c;border-color:var(--cream);}
.pill-btn.icon-only{flex:0 0 54px;color:var(--gold-2);}
.pill-btn.icon-only.on{background:var(--gold-soft);border-color:rgba(216,175,95,.5);}
.pill-btn:active{transform:scale(.97);}

/* ── Tab bar ── */
.tab-bar{position:absolute;left:0;right:0;bottom:0;height:84px;padding:9px 18px 24px;z-index:40;
  display:flex;align-items:flex-start;justify-content:space-around;}
.tab-bar-glass{position:absolute;inset:0;background:linear-gradient(to top,rgba(16,14,11,.96) 40%,rgba(16,14,11,.55));
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;width:64px;
  color:var(--cream-3);transition:color .2s;padding-top:4px;}
.tab span{font-size:10.5px;font-weight:600;letter-spacing:.01em;}
.tab.on{color:var(--gold-2);}

/* ── Detail overlay ── */
.overlay-host{position:absolute;inset:0;z-index:60;pointer-events:none;
  transform:translateY(100%);transition:transform .42s cubic-bezier(.2,.85,.25,1);}
.overlay-host.open{transform:translateY(0);pointer-events:auto;}
.detail-overlay{position:absolute;inset:0;background:var(--bg);overflow:hidden;}
.detail-scroll{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.detail-scroll::-webkit-scrollbar{display:none;}
.detail-hero{position:relative;width:100%;min-height:440px;background:#0a0807;
  display:flex;align-items:center;justify-content:center;overflow:hidden;}
.detail-hero::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 80% at 50% 35%,transparent 55%,rgba(0,0,0,.5));}
.detail-hero-img{max-width:100%;max-height:560px;width:auto;height:auto;object-fit:contain;transition:opacity .5s;
  box-shadow:0 24px 60px rgba(0,0,0,.6);}
.hero-skel{position:absolute;inset:40px;border-radius:8px;}
.hero-expand{position:absolute;bottom:16px;right:16px;width:40px;height:40px;border-radius:50%;z-index:2;
  background:rgba(8,7,6,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.18);color:var(--cream);display:flex;align-items:center;justify-content:center;}
.hero-pd{top:auto;bottom:16px;left:16px;}
.detail-body{padding:26px 24px 150px;}
.detail-title{font-family:var(--serif);font-weight:500;font-size:36px;line-height:1.08;margin:0 0 8px;
  letter-spacing:.3px;text-wrap:pretty;}
.detail-artist{font-size:16px;color:var(--cream-2);line-height:1.4;margin-bottom:16px;}
.chip-row{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:22px;}
.chip{font-size:12px;font-weight:500;color:var(--cream-2);background:var(--surface);
  border:1px solid var(--line);border-radius:100px;padding:6px 12px;}

.note-card{background:linear-gradient(160deg,rgba(216,175,95,.09),rgba(216,175,95,.02));
  border:1px solid rgba(216,175,95,.22);border-radius:18px;padding:18px 18px 16px;margin-bottom:24px;}
.note-head{display:flex;align-items:center;gap:8px;color:var(--gold-2);font-weight:600;font-size:13px;
  letter-spacing:.04em;margin-bottom:11px;}
.note-text{font-family:var(--serif);font-size:20px;line-height:1.42;color:var(--cream);margin:0;font-weight:400;text-wrap:pretty;}
.note-text.muted{color:var(--cream-2);font-size:18px;font-style:italic;}
.note-foot{font-size:10.5px;color:var(--cream-3);margin-top:12px;letter-spacing:.02em;}
.note-loading{display:flex;flex-direction:column;gap:9px;padding:3px 0;}
.note-loading .ln{height:13px;border-radius:6px;background:linear-gradient(110deg,#241d15 8%,#322817 18%,#241d15 33%);
  background-size:220% 100%;animation:sh 1.5s linear infinite;}
.note-loading .ln.short{width:55%;}

.meta-table{border-top:1px solid var(--line);margin-bottom:22px;}
.meta-row{display:flex;gap:16px;padding:13px 2px;border-bottom:1px solid var(--line);}
.meta-label{flex:0 0 96px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--cream-3);font-weight:600;padding-top:2px;}
.meta-value{flex:1;font-size:15px;line-height:1.45;color:var(--cream);text-wrap:pretty;}
.met-link{width:100%;display:flex;align-items:center;justify-content:space-between;padding:16px 18px;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;color:var(--cream);
  font-size:14.5px;font-weight:500;margin-bottom:18px;}
.detail-footer{font-size:11px;color:var(--cream-3);text-align:center;line-height:1.5;}

.detail-topbar{position:absolute;top:50px;left:14px;right:14px;display:flex;justify-content:space-between;z-index:5;}
.detail-actions{display:flex;gap:10px;}
.glass-round{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:rgba(20,17,13,.5);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.14);color:var(--cream);}
.glass-round:active{transform:scale(.92);}
.glass-round.on{color:var(--gold-2);background:rgba(216,175,95,.18);border-color:rgba(216,175,95,.4);}
.detail-dock{position:absolute;left:0;right:0;bottom:0;z-index:5;display:flex;gap:10px;
  padding:14px 18px 30px;background:linear-gradient(to top,rgba(16,14,11,.98) 55%,rgba(16,14,11,0));}
.dock-btn{flex:1;height:50px;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:8px;
  font-size:14px;font-weight:600;background:var(--surface);border:1px solid var(--line-2);color:var(--cream);}
.dock-btn.primary{background:var(--cream);color:#1a140c;border-color:var(--cream);flex:0 0 120px;}
.dock-btn.primary.on{background:var(--gold);border-color:var(--gold);}
.dock-btn:active{transform:scale(.97);}

/* ── Lightbox ── */
.lightbox{position:absolute;inset:0;z-index:80;background:rgba(6,5,4,.98);
  display:flex;align-items:center;justify-content:center;touch-action:none;}
.lb-img{max-width:100%;max-height:100%;object-fit:contain;will-change:transform;cursor:zoom-in;}
.lb-close{position:absolute;top:52px;right:18px;width:44px;height:44px;border-radius:50%;
  background:rgba(255,255,255,.1);color:var(--cream);display:flex;align-items:center;justify-content:center;
  border:1px solid rgba(255,255,255,.18);z-index:2;}
.lb-hint{position:absolute;bottom:42px;left:0;right:0;text-align:center;font-size:12px;color:var(--cream-3);}

/* ── Toast ── */
.toast{position:absolute;left:50%;bottom:108px;transform:translateX(-50%);z-index:70;
  background:rgba(28,23,17,.95);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid var(--line-2);color:var(--cream);padding:11px 20px;border-radius:100px;
  font-size:13.5px;font-weight:600;white-space:nowrap;box-shadow:0 10px 30px rgba(0,0,0,.5);
  animation:toastIn .3s cubic-bezier(.2,.9,.3,1);max-width:80%;overflow:hidden;text-overflow:ellipsis;}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(10px);}to{opacity:1;transform:translateX(-50%) translateY(0);}}

/* ── Web shell: replace the fixed iOS preview frame with a responsive,
      full-viewport layout. On wider screens, present it as a centered
      "device" floating on the salon backdrop. ── */
html,body{height:100dvh;}
#root{width:100%;height:100%;}
.app-root{width:100%;max-width:460px;height:100dvh;margin-inline:auto;}
@media (min-width:520px){
  .app-root{
    height:min(100dvh,920px);
    border-radius:46px;
    border:1px solid rgba(255,255,255,.06);
    box-shadow:0 50px 90px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.04);
  }
}
/* Honour device safe areas (notch / home indicator) on real phones. */
.screen{padding-top:max(54px, env(safe-area-inset-top));}
.tab-bar{height:calc(84px + env(safe-area-inset-bottom));padding-bottom:calc(24px + env(safe-area-inset-bottom));}
.detail-dock{padding-bottom:calc(30px + env(safe-area-inset-bottom));}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="js/met.jsx"></script>

<script type="text/babel" src="js/discover.jsx"></script>
<script type="text/babel" src="js/detail.jsx"></script>
<script type="text/babel" src="js/search.jsx"></script>
<script type="text/babel" src="js/saved.jsx"></script>
<script type="text/babel" src="js/daily.jsx"></script>
